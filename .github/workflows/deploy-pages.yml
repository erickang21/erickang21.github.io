name: Deploy to GitHub Pages

on:
  # Publish on every push to the default branch.
  push:
    branches: [main]
  # ...and allow a manual run from the Actions tab.
  workflow_dispatch:

# Least-privilege token: read the repo, publish a Pages deployment,
# and mint the OIDC token that actions/deploy-pages authenticates with.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. Queued runs are not cancelled, so a deploy
# already in flight is allowed to finish rather than leaving Pages
# half-updated.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # Actions sets CI=true, which makes react-scripts treat ESLint
          # warnings as errors and fail the build. The app has a handful of
          # unused-variable warnings, so opt out rather than gate deploys on
          # lint.
          CI: false

      - name: Prepare artifact
        run: |
          # GitHub Pages does not run Jekyll on artifact-based deployments,
          # but .nojekyll keeps any underscore-prefixed asset safe regardless.
          touch build/.nojekyll

          # The app uses BrowserRouter, so a deep link like /music arrives at
          # Pages as an unknown path. Pages serves 404.html for those, and
          # handing it the SPA shell lets the router take over client-side.
          cp build/index.html build/404.html

          # Optional custom domain. Set a repository variable named
          # CUSTOM_DOMAIN (Settings -> Secrets and variables -> Actions ->
          # Variables) once the domain's DNS points at GitHub Pages. Leave it
          # unset to serve from the default *.github.io URL.
          if [ -n "${CUSTOM_DOMAIN}" ]; then
            echo "${CUSTOM_DOMAIN}" > build/CNAME
          fi
        env:
          CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
